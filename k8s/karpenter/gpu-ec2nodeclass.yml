apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu-inference
spec:
  amiFamily: AL2
  role: REPLACE_WITH_KARPENTER_NODE_ROLE_NAME
  subnetSelectorTerms:
    - tags:
        kubernetes.io/role/internal-elb: "1"
  securityGroupSelectorTerms:
    - tags:
        kubernetes.io/cluster/REPLACE_WITH_CLUSTER_NAME: owned
  tags:
    workload: gpu-inference
    project: cloud-native-llm-inference-optimizer